# pnpm 11 的项目设置文件（单包项目也用它承载设置，不再读 package.json 的 pnpm 字段）。
# msgpackr-extract / protobufjs 是 @opencode/plugin（开发参考）的传递依赖，插件入口
# 运行时不 import 它们，其构建脚本无存在必要——显式拒绝，保住零构建脚本的供应链面。
allowBuilds:
  msgpackr-extract: false
  protobufjs: false
# @opencode/plugin@2.0.0 及其同批依赖于 2026-09-12（安装当日）发布、未满 pnpm 默认
# minimumReleaseAge（1440 分钟）；由安装器自动列入豁免，保证 lockfile 供应链校验一致。
minimumReleaseAgeExclude:
  - '@opencode/ai@2.0.0'
  - '@opencode/client@2.0.0'
  - '@opencode/plugin@2.0.0'
  - '@opencode/protocol@2.0.0'
  - '@opencode/schema@2.0.0'
  - '@opencode/util@2.0.0'
