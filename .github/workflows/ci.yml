name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test · build（ubuntu + bun latest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 pnpm（版本取自 packageManager 字段）
        uses: pnpm/action-setup@v6

      - name: 安装 bun latest（测试运行器）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖（锁文件校验）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 测试
        run: pnpm test

      - name: 构建
        run: pnpm build
