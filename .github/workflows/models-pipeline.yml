name: Models pipeline

# 构建侧全自动流水线（issue #28；规格 docs/dev/spec/model-pipeline.md §2 + ADR docs/dev/adr/0001-artifact-distribution-channels.md）：
# cron 轮询上游 command-code 版本、models.dev 内容 hash 与 view=client catalogVersion，
# 相对上次成功构建有变化才触发解析；三渠道（Release asset / npm 数据包 / data 分支）一次运行同步发布。

on:
  schedule:
    # 每 15 分钟轮询；上游发版到检测平均 ~7.5 分钟延迟，为 ≤30 分钟全网可见 SLA 留出构建与同步时间
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 忽略变更检测，强制完整构建并发布
        type: boolean
        default: false
      drill-prev-distribution:
        description: 对账断言演练：注入伪造的上次 individual-go 非隐藏模型计数（如 999），构建应失败并自动开 issue、不出产物
        type: string
        default: ""

# 串行化是数据包版本（0.0.<Unix 秒 UTC>）严格单调的保证（ADR-0001 修订）：
# 排队而非取消，两次发布不可能落在同一秒。
concurrency:
  group: models-pipeline
  cancel-in-progress: false

permissions:
  contents: write # Release 与 data 分支 force-push
  issues: write # 对账断言失败自动开 issue
  id-token: write # 渠道 2 npm Trusted Publishing（OIDC）

jobs:
  pipeline:
    name: 解析 · 对账 · 三渠道发布
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 渠道 2 认证前置：Trusted Publishing 要求 npm ≥ 11.5.1，而 runner 镜像自带 npm 10.9.8
      # （2026-08-31 ubuntu-latest 镜像实测），必须显式升级；Node 24 自带满足要求的 npm。
      - name: 安装 Node 24（npm ≥ 11.5.1）
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # 发布流水线禁用依赖缓存，防缓存投毒（setup-node 文档）

      - name: 安装 bun（测试运行器 + 构建脚本运行时）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 变更检测（CLI 版本 × models.dev hash × view=client catalogVersion）
        id: detect
        env:
          FORCE: ${{ inputs.force }}
          DRILL: ${{ inputs.drill-prev-distribution }}
        run: |
          set -euo pipefail
          # drill 输入先校验，避免格式错误被下游误报成「对账断言失败」并开 issue
          if [ -n "$DRILL" ] && ! jq -e 'type == "number" and . >= 0 and . == floor' >/dev/null 2>&1 <<<"$DRILL"; then
            echo "::error::drill-prev-distribution 必须是非负整数（individual-go 非隐藏模型计数），收到「${DRILL}」"
            exit 1
          fi
          # catalogVersion 是远程字符串：拒绝会破坏请求头/输出的控制字符与双引号
          header_safe() {
            case "$1" in
              *$'\r'*|*$'\n'*|*'"'*) return 1 ;;
            esac
          }
          LATEST=$(curl -fsSL https://registry.npmjs.org/command-code/latest | jq -r .version)
          DEV_HASH=$(curl -fsSL https://models.dev/api.json | sha256sum | cut -d' ' -f1)
          PREV_CLI=""; PREV_HASH=""; PREV_CATALOG=""; PREV_CATALOG_PRESENT=false
          # data 分支的 build-meta.json = 上次成功构建的基准；同文件兼作下次构建的 individual-go 计数基线
          if curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/build-meta.json" -o prev-meta.json; then
            PREV_CLI=$(jq -r '.sourceCliVersion // empty' prev-meta.json)
            PREV_HASH=$(jq -r '.modelsDevSha256 // empty' prev-meta.json)
            PREV_CATALOG=$(jq -r '.catalogVersion // empty' prev-meta.json)
            if [ -n "$PREV_CATALOG" ]; then
              PREV_CATALOG_PRESENT=true
              if ! header_safe "$PREV_CATALOG"; then
                echo "::warning::build-meta 的 catalogVersion 含无法用于请求头的字符，本轮跳过 catalog 变更检测"
                PREV_CATALOG=""
              fi
            fi
          else
            rm -f prev-meta.json
          fi
          # 实测服务端 ETag 即 catalogVersion，但带双引号（"abc…"）；build-meta 存的是响应体
          # 里的裸值，条件请求必须补回引号，否则永远 200。
          CATALOG_HEADERS=()
          if [ -n "$PREV_CATALOG" ]; then
            CATALOG_HEADERS=(-H "If-None-Match: \"${PREV_CATALOG}\"")
          fi
          CATALOG_STATUS=$(curl -sSL -o catalog.json -w '%{http_code}' \
            "${CATALOG_HEADERS[@]}" \
            'https://api.commandcode.ai/provider/v1/models?view=client') || CATALOG_STATUS="000"
          CATALOG_VERSION=""
          if [ "$CATALOG_STATUS" = "304" ]; then
            CATALOG_VERSION="$PREV_CATALOG"
          elif [ "$CATALOG_STATUS" = "200" ]; then
            CATALOG_VERSION=$(jq -r '.catalogVersion // empty' catalog.json 2>/dev/null || true)
            if [ -n "$CATALOG_VERSION" ] && ! header_safe "$CATALOG_VERSION"; then
              echo "::warning::view=client 的 catalogVersion 含无法安全记录的字符，本轮跳过 catalog 变更检测"
              CATALOG_VERSION=""
            elif [ -z "$CATALOG_VERSION" ]; then
              echo "::warning::view=client 响应缺 catalogVersion，本轮跳过 catalog 变更检测"
            fi
          else
            echo "::warning::view=client catalog 拉取失败（HTTP ${CATALOG_STATUS:-无}），本轮跳过 catalog 变更检测"
          fi
          SHOULD=false; REASON=""
          if [ "$FORCE" = "true" ]; then
            SHOULD=true; REASON="手动强制"
          elif [ -n "$DRILL" ]; then
            # 演练必须穿过变更检测门槛进构建步，否则基准刚更新过时演练会被跳过
            SHOULD=true; REASON="对账断言演练"
          elif [ -z "$PREV_CLI" ] || [ "$PREV_CLI" = "null" ]; then
            SHOULD=true; REASON="首次构建（无上次成功基准）"
          elif [ "$PREV_CLI" != "$LATEST" ]; then
            SHOULD=true; REASON="command-code 发版 ${PREV_CLI} → ${LATEST}"
          elif [ "$PREV_HASH" != "$DEV_HASH" ]; then
            SHOULD=true; REASON="models.dev 内容变化（上游未发版，limits 数据更新）"
          elif [ -n "$CATALOG_VERSION" ] && [ "$PREV_CATALOG_PRESENT" = false ]; then
            # 旧 build-meta 确实没有 catalogVersion：构建一次建立基准，否则 catalog-only 变更永远检测不到
            SHOULD=true; REASON="view=client catalogVersion 基准缺失（旧 build-meta），建立基准"
          elif [ -n "$PREV_CATALOG" ] && [ -n "$CATALOG_VERSION" ] && [ "$PREV_CATALOG" != "$CATALOG_VERSION" ]; then
            SHOULD=true; REASON="view=client catalogVersion 变化 ${PREV_CATALOG} → ${CATALOG_VERSION}"
          fi
          {
            echo "cli-version=${LATEST}"
            echo "should-build=${SHOULD}"
            echo "reason=${REASON}"
          } >> "$GITHUB_OUTPUT"
          echo "变更检测：should=${SHOULD} reason=${REASON}（上次 CLI ${PREV_CLI:-无} → 本次 ${LATEST}；上次 catalog ${PREV_CATALOG:-无} → 本次 ${CATALOG_VERSION:-未知}）"

      - name: 对账断言演练（注入伪造的上次 individual-go 计数）
        if: inputs.drill-prev-distribution != ''
        env:
          DRILL_GO_COUNT: ${{ inputs.drill-prev-distribution }}
        run: |
          set -euo pipefail
          jq -n --argjson goModelCount "$DRILL_GO_COUNT" \
            '{schemaVersion: 1, sourceCliVersion: "drill", catalogVersion: "drill", generatedAt: "1970-01-01T00:00:00Z", modelsDevSha256: "drill", modelsJsonSha256: "drill", goModelCount: $goModelCount, modelsCount: 0}' \
            > drill-prev-meta.json
          echo "演练用伪造 prev-meta：$(cat drill-prev-meta.json)"

      - name: 构建（tarball 文本解析 → 对账断言 → 产物）
        if: steps.detect.outputs.should-build == 'true'
        run: |
          set -o pipefail
          PREV=""
          if [ -f drill-prev-meta.json ]; then PREV="--prev-meta drill-prev-meta.json"
          elif [ -f prev-meta.json ]; then PREV="--prev-meta prev-meta.json"
          fi
          bun scripts/build-models/main.ts --out-dir artifact --cli-version "${{ steps.detect.outputs.cli-version }}" $PREV 2>&1 | tee build.log

      - name: 对账失败自动开 issue（不静默出产物）
        if: failure() && steps.detect.outputs.should-build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f build.log ] || echo "（构建在写日志前即失败）" > build.log
          BODY=$(mktemp)
          {
            echo "构建流水线对账断言失败，本次运行未产出任何产物。"
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- 上游 CLI 版本：${{ steps.detect.outputs.cli-version }}"
            echo "- 触发原因：${{ steps.detect.outputs.reason }}"
            echo
            echo '<details><summary>构建日志（尾部 100 行）</summary>'
            echo
            echo '```'
            tail -100 build.log
            echo '```'
            echo '</details>'
          } > "$BODY"
          TITLE="构建流水线对账断言失败"
          # 标签缺失不应炸掉失败路径：缺则自建（需 issues:write，本 run 已有）
          gh label create "需人工实现" --color F9D0C4 --description "需要人类亲自实现" --force >/dev/null 2>&1 || true
          OPEN=$(gh issue list --search "${TITLE} in:title state:open" --json number --jq 'length')
          if [ "$OPEN" -gt 0 ]; then
            # 已有未关闭的对账 issue：追加评论而非新建，防轮询周期刷屏
            NUM=$(gh issue list --search "${TITLE} in:title state:open" --json number --jq '.[0].number')
            gh issue comment "$NUM" --body-file "$BODY"
          else
            gh issue create --title "${TITLE}（$(date -u +%Y-%m-%d)）" --body-file "$BODY" --label 需人工实现
          fi

      - name: 发布版本号（0.0.<Unix 秒 UTC>）
        id: version
        if: steps.detect.outputs.should-build == 'true'
        env:
          PKG: "@wallbreakerno4/opencode-commandcode-models"
        run: |
          set -euo pipefail
          TS=$(date -u +%s)
          # concurrency 串行已排除本流水线的同秒碰撞；此查询只是对仓库外已发布版本的廉价保险
          if npm view "${PKG}@0.0.${TS}" version >/dev/null 2>&1; then
            TS=$((TS + 1))
          fi
          echo "npm-version=0.0.${TS}" >> "$GITHUB_OUTPUT"
          echo "数据包版本：0.0.${TS}"

      # 三渠道顺序发布：任一渠道中途失败，本次 run 即失败退出，data 分支（含 build-meta）
      # 未更新 → 下一轮 cron 重新触发构建 → 新版本号整体重发，最终一致；
      # 途中多出的 Release / npm 版本留作审计痕迹，无需补偿逻辑。
      - name: 渠道 1 · GitHub Release asset（releases/latest/download/models.json 主源）
        if: steps.detect.outputs.should-build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.npm-version }}
        run: |
          set -euo pipefail
          gh release create "models-${VERSION}" artifact/models.json \
            --title "模型目录 ${VERSION}" \
            --notes "command-code@${{ steps.detect.outputs.cli-version }} 的构建产物（schema v1，Go plan 子集）。与 npm 数据包 ${VERSION}、data 分支同轮发布，三渠道内容一致（sha256=$(sha256sum artifact/models.json | cut -d' ' -f1)）。"

      - name: 渠道 2 · npm 数据包（npmmirror files 同步源）
        if: steps.detect.outputs.should-build == 'true'
        env:
          VERSION: ${{ steps.version.outputs.npm-version }}
        run: |
          set -euo pipefail
          mkdir -p publish
          cp artifact/models.json publish/models.json
          cat > publish/package.json <<JSON
          {
            "name": "@wallbreakerno4/opencode-commandcode-models",
            "version": "${VERSION}",
            "description": "Command Code Go plan 模型目录数据包：构建流水线产物，供 OpenCode 插件运行时经 npmmirror files / unpkg 匿名拉取。",
            "files": ["models.json"],
            "license": "UNLICENSED",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/WallBreakerNO4/opencode-commandcode-provider.git"
            }
          }
          JSON
          # 只打 latest tag（ADR-0001：无人类消费场景，溯源走 packument 的 time 字段）；
          # 作用域包默认 restricted，免费账号首次发布必须显式 --access public，否则 402（npm scope 文档）
          # 认证走 Trusted Publishing（docs/dev/adr/0001-artifact-distribution-channels.md 修订 2026-09-11）：
          # 顶层 id-token: write 换取短命 OIDC 凭证，无 NODE_AUTH_TOKEN、不再手工写 publish/.npmrc；
          # provenance 由 npm 自动生成，--provenance 显式保留以固定意图
          cd publish && npm publish --access public --provenance

      - name: 渠道 3 · data 分支 force-push（raw 灾备）
        if: steps.detect.outputs.should-build == 'true'
        run: |
          set -euo pipefail
          git config user.name "models-pipeline[bot]"
          git config user.email "models-pipeline[bot]@users.noreply.github.com"
          git checkout --orphan data-publish
          git rm -rf --quiet .
          cp artifact/models.json artifact/build-meta.json .
          git add -f models.json build-meta.json
          git commit -m "构建产物发布 ${{ steps.version.outputs.npm-version }}（command-code@${{ steps.detect.outputs.cli-version }}）"
          git push --force origin data-publish:data
